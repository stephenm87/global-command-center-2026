name: Secret Scan

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Secret Scanning
        run: |
          docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:3.100.0 git file:///pwd --only-verified
