name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check for secrets in output
        run: |
          if grep -iR 'AIza[0-9A-Za-z-_]{35}' dist/ ; then echo "Google API key found in build"; exit 1; fi
          if grep -iR 'sk-[a-zA-Z0-9]{32,}' dist/ ; then echo "Generic API key found in build"; exit 1; fi
          echo "No obvious secrets found in dist/"
