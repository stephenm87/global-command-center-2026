[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ── Security Headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https://unpkg.com https://raw.githubusercontent.com https://www.netlify.com data: blob:; connect-src 'self' https://*.supabase.co https://api.gdeltproject.org https://api.firecrawl.dev https://google.serper.dev https://generativelanguage.googleapis.com https://language.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src blob:"
